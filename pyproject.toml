[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "dltools"
version = "0.1.0"
description = "Deep Learning Tools: preprocessing and postprocessing toolkit for multi-domain ML workloads."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "DLTools Contributors" }]
keywords = ["deep-learning", "cv", "radar", "toolkit", "preprocessing"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "tqdm>=4.66",
  "rich>=13.7",
]

[project.optional-dependencies]
cv = [
  "opencv-python>=4.9",
  "pillow>=10.0",
]
radar = [
  "readgssi>=0.0.24",
  "h5py>=3.10",
]
dev = [
  "pytest>=8.1",
  "pytest-cov>=5.0",
  "ruff>=0.4.0",
]
all = [
  "dltools[cv,radar,dev]",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dltools"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
